<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakeupMatch | Buscar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="page page-search">
  <header class="navbar">
    <div class="navbar__inner">
      <a class="brand" href="/">
        <span class="brand-mark">MM</span>
        <span class="brand-text">MakeupMatch</span>
      </a>
      <nav class="navbar__links">
        <a href="/">Início</a>
        <a href="/perfil.html">Perfil</a>
        <a class="active" href="/buscar.html">Buscar</a>
        <a href="/recomendacoes.html">Recomendações</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <section class="page-intro page-intro--row">
      <div>
        <span class="kicker">Etapa 2 de 3</span>
        <h1>Busque maquiagens por linguagem natural.</h1>
        <p class="lead">
          Exemplo: “base para pele oleosa com acabamento natural”.
          A instância ranqueia os produtos por busca e compatibilidade.
        </p>
      </div>
      <a class="btn btn--ghost" href="/perfil.html">Editar perfil</a>
    </section>

    <section class="search-workspace">
      <div class="search-panel">
        <form class="search-card search-card--large" id="search-form">
          <input id="query" type="text" value="base para pele oleosa acabamento natural" />
          <button class="btn" type="submit">Buscar</button>
        </form>

        <div class="chips">
          <button type="button" data-query="base para pele oleosa acabamento natural">Base pele oleosa</button>
          <button type="button" data-query="batom vermelho matte para noite">Batom vermelho</button>
          <button type="button" data-query="corretivo para olheiras acabamento natural">Corretivo</button>
          <button type="button" data-query="blush glow pêssego">Blush glow</button>
        </div>
      </div>

      <div id="results" class="products-grid"></div>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
